<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}MK Chats{% endblock %}</title>
    <link href="/static/css/output.css" rel="stylesheet">
    <script nonce="{{ request.state.nonce }}" src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link href="/static/css/global.css" rel="stylesheet">

</head>

<body class="antialiased flex flex-col items-center p-0 md:p-6 lg:p-10">
    {% block content %}
    {% endblock %}

    <!-- Global Custom Modal -->
    <div id="customModal"
        class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="glass-panel max-w-sm w-full p-8 rounded-2xl transform scale-95 transition-transform duration-200 text-left"
            id="modalContent">
            <h3 class="text-xl font-bold text-white mb-2" id="modalTitle">Notice</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed" id="modalDescription">System notice generated.</p>

            <div id="modalInputContainer" class="hidden mb-6">
                <textarea id="modalInput" class="w-full glass-input min-h-[120px] text-sm resize-none"
                    placeholder="Type here..."></textarea>
            </div>

            <div class="flex flex-col gap-3">
                <button id="modalConfirmBtn" class="primary-btn w-full">Confirm</button>
                <button id="modalCancelBtn" class="secondary-btn w-full">Cancel</button>
            </div>
        </div>
    </div>

    <script nonce="{{ request.state.nonce }}">
        function syncAppHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        syncAppHeight();
        window.addEventListener('resize', syncAppHeight);
        window.addEventListener('orientationchange', syncAppHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncAppHeight);
            window.visualViewport.addEventListener('scroll', syncAppHeight);
        }

        let modalResolve = null;
        let hideModalTimeout = null;

        function showModal({ title, description, placeholder, value, isAlert = false }) {
            if (hideModalTimeout) clearTimeout(hideModalTimeout);

            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            const inputContainer = document.getElementById('modalInputContainer');
            const input = document.getElementById('modalInput');

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;

            if (placeholder || value !== undefined) {
                inputContainer.classList.remove('hidden');
                input.placeholder = placeholder || "Type here...";
                input.value = value || "";
            } else {
                inputContainer.classList.add('hidden');
            }

            if (isAlert) {
                document.getElementById('modalCancelBtn').classList.add('hidden');
            } else {
                document.getElementById('modalCancelBtn').classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            return new Promise((resolve) => {
                modalResolve = resolve;
            });
        }

        function hideModal() {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            hideModalTimeout = setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const input = document.getElementById('modalInput');
            const val = input.value;
            hideModal();
            if (modalResolve) modalResolve(val || true);
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => {
            hideModal();
            if (modalResolve) modalResolve(null);
        });

        function initPasswordToggles() {
            document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
                if (btn.dataset.passwordToggleBound === 'true') {
                    return;
                }

                btn.dataset.passwordToggleBound = 'true';
                const inputId = btn.getAttribute('data-password-toggle');
                const input = document.getElementById(inputId);
                if (!input) {
                    return;
                }

                const showIcon = btn.querySelector('[data-password-toggle-show]');
                const hideIcon = btn.querySelector('[data-password-toggle-hide]');

                function syncPasswordToggleIcons() {
                    const passwordHidden = input.type === 'password';
                    btn.setAttribute('aria-label', passwordHidden ? 'Show password' : 'Hide password');
                    btn.setAttribute('aria-pressed', String(!passwordHidden));

                    if (showIcon && hideIcon) {
                        showIcon.classList.toggle('is-hidden', !passwordHidden);
                        hideIcon.classList.toggle('is-hidden', passwordHidden);
                        showIcon.style.display = passwordHidden ? 'block' : 'none';
                        hideIcon.style.display = passwordHidden ? 'none' : 'block';
                    }
                }

                syncPasswordToggleIcons();

                btn.addEventListener('click', () => {
                    input.type = input.type === 'password' ? 'text' : 'password';
                    syncPasswordToggleIcons();
                });
            });
        }

        initPasswordToggles();
    </script>
</body>

</html>
