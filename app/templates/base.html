<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}MK Chats{% endblock %}</title>
    <script nonce="{{ request.state.nonce }}" src="https://cdn.tailwindcss.com"></script>
    <script nonce="{{ request.state.nonce }}" src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100dvh;
        }

        html {
            background-color: #344878;
            /* Prevents transparent scrollbar tracks from revealing default white HTML background! */
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            height: var(--app-height);
            width: 100%;
            min-height: var(--app-height);
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        .mobile-app-shell {
            min-height: var(--app-height);
            height: var(--app-height);
        }

        @media (min-width: 768px) {
            .mobile-app-shell {
                min-height: 0;
                height: 90vh;
            }
        }

        .chat-input-safe-padding {
            padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem);
        }

        @media (min-width: 768px) {
            .chat-input-safe-padding {
                padding-bottom: 2rem;
            }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
            border-radius: 0.75rem;
            padding: 0.875rem 1.25rem;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.5);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .password-input-wrap {
            position: relative;
        }

        .password-input-wrap .glass-input {
            padding-right: 3.75rem;
        }

        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 0.875rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: rgba(199, 210, 254, 0.85);
            padding: 0.25rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: white;
        }

        .password-toggle-btn svg {
            width: 1.1rem;
            height: 1.1rem;
            display: block;
        }

        .password-toggle-icon.is-hidden {
            display: none;
        }

        .password-toggle-btn:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.6);
            outline-offset: 2px;
            border-radius: 9999px;
        }

        .primary-btn {
            background: linear-gradient(to right, #6366f1, #a855f7);
            color: white;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
            border: none;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Webkit custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.5);
            /* Transparent black thumb */
            border-radius: 10px;
            min-height: 40px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(0, 0, 0, 0.7);
            /* Darker transparent black */
        }

        /* Firefox fallback */
        @-moz-document url-prefix() {
            * {
                scrollbar-color: rgba(0, 0, 0, 0.5) transparent;
                scrollbar-width: thin;
            }
        }

        .error-message {
            display: none;
            color: #f87171;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>

<body class="antialiased flex items-stretch md:items-center justify-center p-0 md:p-6 lg:p-10 min-h-screen">
    {% block content %}
    {% endblock %}

    <!-- Global Custom Modal -->
    <div id="customModal"
        class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="glass-panel max-w-sm w-full p-8 rounded-2xl transform scale-95 transition-transform duration-200 text-left"
            id="modalContent">
            <h3 class="text-xl font-bold text-white mb-2" id="modalTitle">Notice</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed" id="modalDescription">System notice generated.</p>

            <div id="modalInputContainer" class="hidden mb-6">
                <textarea id="modalInput" class="w-full glass-input min-h-[120px] text-sm resize-none"
                    placeholder="Type here..."></textarea>
            </div>

            <div class="flex flex-col gap-3">
                <button id="modalConfirmBtn" class="primary-btn w-full">Confirm</button>
                <button id="modalCancelBtn" class="secondary-btn w-full">Cancel</button>
            </div>
        </div>
    </div>

    <script nonce="{{ request.state.nonce }}">
        function syncAppHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        syncAppHeight();
        window.addEventListener('resize', syncAppHeight);
        window.addEventListener('orientationchange', syncAppHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncAppHeight);
            window.visualViewport.addEventListener('scroll', syncAppHeight);
        }

        let modalResolve = null;

        function showModal({ title, description, placeholder, value, isAlert = false }) {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            const inputContainer = document.getElementById('modalInputContainer');
            const input = document.getElementById('modalInput');

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;

            if (placeholder || value !== undefined) {
                inputContainer.classList.remove('hidden');
                input.placeholder = placeholder || "Type here...";
                input.value = value || "";
            } else {
                inputContainer.classList.add('hidden');
            }

            if (isAlert) {
                document.getElementById('modalCancelBtn').classList.add('hidden');
            } else {
                document.getElementById('modalCancelBtn').classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            return new Promise((resolve) => {
                modalResolve = resolve;
            });
        }

        function hideModal() {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const input = document.getElementById('modalInput');
            const val = input.value;
            hideModal();
            if (modalResolve) modalResolve(val || true);
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => {
            hideModal();
            if (modalResolve) modalResolve(null);
        });

        function initPasswordToggles() {
            document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
                if (btn.dataset.passwordToggleBound === 'true') {
                    return;
                }

                btn.dataset.passwordToggleBound = 'true';
                const inputId = btn.getAttribute('data-password-toggle');
                const input = document.getElementById(inputId);
                if (!input) {
                    return;
                }

                const showIcon = btn.querySelector('[data-password-toggle-show]');
                const hideIcon = btn.querySelector('[data-password-toggle-hide]');

                function syncPasswordToggleIcons() {
                    const passwordHidden = input.type === 'password';
                    btn.setAttribute('aria-label', passwordHidden ? 'Show password' : 'Hide password');
                    btn.setAttribute('aria-pressed', String(!passwordHidden));

                    if (showIcon && hideIcon) {
                        showIcon.classList.toggle('is-hidden', !passwordHidden);
                        hideIcon.classList.toggle('is-hidden', passwordHidden);
                    }
                }

                syncPasswordToggleIcons();

                btn.addEventListener('click', () => {
                    input.type = input.type === 'password' ? 'text' : 'password';
                    syncPasswordToggleIcons();
                });
            });
        }

        initPasswordToggles();
    </script>
</body>

</html>
