<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}MK Chats{% endblock %}</title>
    <script nonce="{{ request.state.nonce }}" src="https://cdn.tailwindcss.com"></script>
    <script nonce="{{ request.state.nonce }}">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#10131a",
                        surface: "#10131a",
                        "surface-dim": "#10131a",
                        "surface-tint": "#c3c0ff",
                        "surface-bright": "#363940",
                        "surface-container-lowest": "#0b0e14",
                        "surface-container-low": "#191c22",
                        "surface-container": "#1d2026",
                        "surface-container-high": "#272a31",
                        "surface-container-highest": "#32353c",
                        "surface-variant": "#32353c",
                        "on-surface": "#e1e2eb",
                        "on-surface-variant": "#c7c4d8",
                        outline: "#918fa1",
                        "outline-variant": "#464555",
                        primary: "#c3c0ff",
                        "primary-container": "#4f46e5",
                        "primary-fixed": "#e2dfff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary": "#1d00a5",
                        "on-primary-container": "#dad7ff",
                        "on-primary-fixed": "#0f0069",
                        "on-primary-fixed-variant": "#3323cc",
                        secondary: "#c4c6cf",
                        "secondary-container": "#464950",
                        "secondary-fixed": "#e1e2eb",
                        "secondary-fixed-dim": "#c4c6cf",
                        "on-secondary": "#2e3037",
                        "on-secondary-container": "#b6b8c1",
                        "on-secondary-fixed": "#191c22",
                        "on-secondary-fixed-variant": "#44474e",
                        tertiary: "#00daf3",
                        "tertiary-container": "#006a77",
                        "tertiary-fixed": "#9cf0ff",
                        "tertiary-fixed-dim": "#00daf3",
                        "on-tertiary": "#00363d",

                        "on-tertiary-fixed": "#001f24",
                        "on-tertiary-fixed-variant": "#004f58",
                        error: "#ffb4ab",
                        "error-container": "#93000a",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e1e2eb",
                        "inverse-on-surface": "#2e3037",
                        "inverse-primary": "#4d44e3",
                        kin_bg: "#10131a",
                        kin_surf_lowest: "#0b0e14",
                        kin_surf_low: "#191c22",
                        kin_surf: "#10131a",
                        kin_surf_high: "#272a31",
                        kin_surf_highest: "#32353c",
                        kin_on_surface: "#e1e2eb",
                        kin_on_surface_variant: "#c7c4d8",
                        kin_outline: "#918fa1",
                        kin_outline_variant: "#464555",
                        kin_primary: "#c3c0ff",
                        kin_primary_container: "#4f46e5",
                        kin_tertiary: "#00daf3"
                    },
                    fontFamily: {
                        manrope: ['Manrope', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']

                }
            }
        }
    </script>
    <script nonce="{{ request.state.nonce }}" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        :root {
            --app-height: 100dvh;
        }

        html {
            background-color: #0b0e14;
            /* Prevents transparent scrollbar tracks from revealing default white HTML background! */
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e14;
            color: #e1e2eb;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
        }

        .mobile-app-shell {
            min-height: var(--app-height);
            height: var(--app-height);
        }

        @media (min-width: 768px) {
            .mobile-app-shell {
                min-height: 0;
                height: 90vh;
            }
        }

        .chat-input-safe-padding {
            padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem);
        }

        @media (min-width: 768px) {
            .chat-input-safe-padding {
                padding-bottom: 2rem;
            }
        }

        .glass-panel {
            background: rgba(29, 32, 38, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(70, 69, 85, 0.1);
        }

        .cinematic-glow {
            background: radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.15) 0%, rgba(16, 19, 26, 0) 70%);
        }

        .glass-card {
            background: rgba(29, 32, 38, 0.6);
            backdrop-filter: blur(32px);
            border: 1px solid rgba(70, 69, 85, 0.15);
        }

        .gradient-button {
            background: linear-gradient(135deg, #4f46e5 0%, #c3c0ff 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gradient-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        }

        .gradient-button:active {
            transform: translateY(0);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
            border-color: rgba(195, 192, 255, 0.2);
        }

        .bloom-top-right {
            background: radial-gradient(circle at 100% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 60%);
        }

        .bloom-bottom-left {
            background: radial-gradient(circle at 0% 100%, rgba(0, 218, 243, 0.12) 0%, transparent 50%);
        }

        .manrope {
            font-family: 'Manrope', sans-serif;
        }

        .glass-input {
            background: #0b0e14;
            /* kin_surf_lowest */
            border: 1px solid transparent;
            color: #e1e2eb;
            /* kin_on_surface */
            border-radius: 0.75rem;
            padding: 0.875rem 1.25rem;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            outline: none;
            border: 1px solid rgba(195, 192, 255, 0.2);
            /* 20% kin_primary ghost border */
            background: #0b0e14;
            caret-color: #00daf3;
            /* kin_tertiary */
        }

        .password-input-wrap {
            position: relative;
        }

        .password-input-wrap .glass-input {
            padding-right: 3.75rem;
        }

        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 0.875rem;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: rgba(199, 210, 254, 0.85);
            padding: 0.25rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: white;
        }

        .password-toggle-btn .material-symbols-outlined {
            font-size: 1.1rem;
            display: block;
        }

        .password-toggle-icon.is-hidden {
            display: none;
        }

        .password-toggle-btn:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.6);
            outline-offset: 2px;
            border-radius: 9999px;
        }

        .primary-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #c3c0ff 100%);
            color: #10131a;
            font-weight: 700;
            padding: 0.875rem 1.5rem;
            border-radius: 9999px;
            /* full roundedness */
            transition: all 0.2s;
            border: none;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 218, 243, 0.2);
            /* Interaction Glow */
        }

        .secondary-btn {
            background: #32353c;
            /* kin_surf_highest */
            color: #e1e2eb;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 9999px;
            transition: all 0.2s;
            border: none;
        }

        .secondary-btn:hover {
            opacity: 0.9;
        }

        /* Webkit custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.5);
            /* Transparent black thumb */
            border-radius: 10px;
            min-height: 40px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(0, 0, 0, 0.7);
            /* Darker transparent black */
        }

        /* Firefox fallback */
        @-moz-document url-prefix() {
            * {
                scrollbar-color: rgba(0, 0, 0, 0.5) transparent;
                scrollbar-width: thin;
            }
        }

        .error-message {
            display: none;
            color: #f87171;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>

<body class="antialiased flex flex-col items-center p-0 md:p-6 lg:p-10">
    {% block content %}
    {% endblock %}

    <!-- Global Custom Modal -->
    <div id="customModal"
        class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
        <div class="glass-panel max-w-sm w-full p-8 rounded-2xl transform scale-95 transition-transform duration-200 text-left"
            id="modalContent">
            <h3 class="text-xl font-bold text-white mb-2" id="modalTitle">Notice</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed" id="modalDescription">System notice generated.</p>

            <div id="modalInputContainer" class="hidden mb-6">
                <textarea id="modalInput" class="w-full glass-input min-h-[120px] text-sm resize-none"
                    placeholder="Type here..."></textarea>
            </div>

            <div class="flex flex-col gap-3">
                <button id="modalConfirmBtn" class="primary-btn w-full">Confirm</button>
                <button id="modalCancelBtn" class="secondary-btn w-full">Cancel</button>
            </div>
        </div>
    </div>

    <script nonce="{{ request.state.nonce }}">
        function syncAppHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        syncAppHeight();
        window.addEventListener('resize', syncAppHeight);
        window.addEventListener('orientationchange', syncAppHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncAppHeight);
            window.visualViewport.addEventListener('scroll', syncAppHeight);
        }

        let modalResolve = null;

        function showModal({ title, description, placeholder, value, isAlert = false }) {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            const inputContainer = document.getElementById('modalInputContainer');
            const input = document.getElementById('modalInput');

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;

            if (placeholder || value !== undefined) {
                inputContainer.classList.remove('hidden');
                input.placeholder = placeholder || "Type here...";
                input.value = value || "";
            } else {
                inputContainer.classList.add('hidden');
            }

            if (isAlert) {
                document.getElementById('modalCancelBtn').classList.add('hidden');
            } else {
                document.getElementById('modalCancelBtn').classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            return new Promise((resolve) => {
                modalResolve = resolve;
            });
        }

        function hideModal() {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const input = document.getElementById('modalInput');
            const val = input.value;
            hideModal();
            if (modalResolve) modalResolve(val || true);
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => {
            hideModal();
            if (modalResolve) modalResolve(null);
        });

        function initPasswordToggles() {
            document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
                if (btn.dataset.passwordToggleBound === 'true') {
                    return;
                }

                btn.dataset.passwordToggleBound = 'true';
                const inputId = btn.getAttribute('data-password-toggle');
                const input = document.getElementById(inputId);
                if (!input) {
                    return;
                }

                const showIcon = btn.querySelector('[data-password-toggle-show]');
                const hideIcon = btn.querySelector('[data-password-toggle-hide]');

                function syncPasswordToggleIcons() {
                    const passwordHidden = input.type === 'password';
                    btn.setAttribute('aria-label', passwordHidden ? 'Show password' : 'Hide password');
                    btn.setAttribute('aria-pressed', String(!passwordHidden));

                    if (showIcon && hideIcon) {
                        showIcon.classList.toggle('is-hidden', !passwordHidden);
                        hideIcon.classList.toggle('is-hidden', passwordHidden);
                    }
                }

                syncPasswordToggleIcons();

                btn.addEventListener('click', () => {
                    input.type = input.type === 'password' ? 'text' : 'password';
                    syncPasswordToggleIcons();
                });
            });
        }

        initPasswordToggles();
    </script>
</body>

</html>
