{% extends "base.html" %}

{% block title %}Forgot Password - MK Chats{% endblock %}

{% block content %}
<div class="fixed inset-0 cinematic-glow pointer-events-none"></div>
<div class="fixed -top-24 -left-24 w-96 h-96 bg-kin_primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed -bottom-24 -right-24 w-96 h-96 bg-kin_tertiary/5 blur-[120px] rounded-full pointer-events-none"></div>

<main class="w-full max-w-md px-6 z-10 flex flex-col items-center justify-center min-h-screen my-auto">
    <!-- Brand Identity -->
    <div class="flex flex-col items-center mb-10 text-center animate-in fade-in slide-in-from-top-4 duration-700">
        <div class="w-16 h-16 bg-kin_surf_highest rounded-2xl flex items-center justify-center mb-4 shadow-[0_0_40px_rgba(79,70,229,0.1)] border border-white/5">
            <span class="material-symbols-outlined text-indigo-400 text-4xl" style="font-variation-settings: 'FILL' 1;">security</span>
        </div>
        <h1 class="font-manrope text-3xl font-black tracking-tighter text-kin_on_surface mb-1">MK Chats</h1>
        <p class="font-inter text-sm text-kin_on_surface_variant tracking-wide uppercase font-semibold">Credential Recovery</p>
    </div>

    <!-- Forgot Password Card -->
    <div class="glass-card rounded-[2rem] p-8 md:p-10 shadow-2xl relative overflow-hidden w-full animate-in fade-in zoom-in-95 duration-500">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-indigo-500/30 to-transparent"></div>
        <div class="mb-8 text-center sm:text-left">
            <h2 class="font-manrope text-2xl font-bold text-kin_on_surface">Reset Password</h2>
            <p class="font-inter text-sm text-kin_on_surface_variant mt-1">Enter your registered email address to receive a recovery link.</p>
        </div>

        <form id="forgotForm" class="space-y-6">
            <!-- Email Field -->
            <div class="space-y-2">
                <label class="block font-inter text-[10px] font-bold text-kin_on_surface_variant ml-1 uppercase tracking-[0.2em]" for="email">Email Address</label>
                <div class="relative group input-glow transition-all duration-300 rounded-xl">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-kin_outline text-lg">alternate_email</span>
                    </div>
                    <input class="w-full bg-kin_surf_lowest border-none rounded-xl py-4 pl-12 pr-4 text-kin_on_surface placeholder:text-kin_outline_variant/50 focus:ring-1 focus:ring-kin_primary/30 transition-all font-inter text-sm" 
                           id="email" placeholder="identity@secure.net" type="email" required />
                </div>
            </div>

            <div id="statusMsg" class="text-[12px] text-kin_tertiary font-bold text-center hidden bg-kin_primary/10 p-4 rounded-xl border border-kin_primary/20 uppercase tracking-widest leading-relaxed"></div>
            <div id="errorMsg" class="text-[12px] font-bold text-kin_tertiary bg-red-900/20 border border-kin_tertiary/20 rounded-xl p-4 text-center hidden animate-in fade-in duration-300"></div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button id="submitBtn" class="gradient-button w-full py-4 rounded-xl font-manrope font-extrabold text-white shadow-[0_4px_20px_rgba(79,70,229,0.2)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 group" type="submit">
                    Send Link
                    <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">mail</span>
                </button>
            </div>
        </form>

        <div class="mt-10 pt-8 border-t border-white/5 text-center">
            <a href="/login" class="text-indigo-400 font-bold hover:underline decoration-indigo-500/30 underline-offset-4 transition-all text-sm">Back to Secure Login</a>
        </div>
    </div>
</main>

<script src="/js/forgot_password.js" nonce="{{ request.state.nonce }}"></script>
{% endblock %}
