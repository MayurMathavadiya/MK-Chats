{% extends "base.html" %}

{% block title %}Forgot Password - MK Chats{% endblock %}

{% block content %}
<div class="flex flex-1 items-center justify-center p-4 md:p-8">
    <div class="glass-panel w-full max-w-md p-8 md:p-12 rounded-2xl relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob"></div>
        <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob animation-delay-2000"></div>
        
        <div class="flex flex-col items-center mb-10 relative z-10">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg border border-white/20 mb-5">
                <img src="/static/branding/mk-chats-logo.svg" alt="MK Chats logo" class="w-7 h-7 object-contain">
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide text-center">Reset Password</h2>
            <p class="text-sm text-gray-400 font-medium mt-2 text-center">Enter your registered email address to receive a reset link.</p>
        </div>

        <form id="forgotForm" class="space-y-6 relative z-10">
            <div class="space-y-2">
                <label class="block text-xs text-gray-300 font-semibold uppercase tracking-wider ml-1" for="email">Email Address</label>
                <input type="email" id="email" required class="w-full glass-input" placeholder="john@example.com">
            </div>

            <div id="statusMsg" class="text-xs text-indigo-300 font-medium bg-indigo-500/20 border border-indigo-500/30 rounded-lg p-4 text-center hidden"></div>
            <div id="errorMsg" class="text-xs text-red-200 font-medium bg-red-500/20 border border-red-500/30 rounded-lg p-4 text-center hidden"></div>

            <button type="submit" id="submitBtn" class="primary-btn w-full mt-4 text-sm tracking-wide">
                <span>Send Reset Link</span>
            </button>
        </form>

        <div class="mt-8 pt-6 flex flex-col items-center gap-3 border-t border-white/10 relative z-10">
            <a href="/login" class="text-sm text-indigo-300 font-semibold hover:text-white transition-all">Back to Login</a>
        </div>
    </div>
</div>

<script src="/js/forgot_password.js" nonce="{{ request.state.nonce }}"></script>
{% endblock %}
